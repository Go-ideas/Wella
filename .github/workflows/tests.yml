name: Wella tests

on:
  push:
    branches: [Wella]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile app.py bayesian_journey.py engine.py tendential.py
      - run: pytest -q
        env:
          PYTHONPATH: .
